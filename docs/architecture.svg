<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6572"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cfd5dd;stroke-width:1.5;rx:10}
      .aws{fill:#fff5e6}
      .lbl{font-size:13px;fill:#1b1f24;font-weight:600}
      .sub{font-size:11px;fill:#6b7480}
      .grp{fill:#f5f7fa;stroke:#e1e6ec;stroke-width:1.5}
      .grptitle{font-size:11px;fill:#8a929d;font-weight:700;letter-spacing:.06em}
      .edge{stroke:#5b6572;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .edgelbl{font-size:10.5px;fill:#6b7480}
      .det{fill:#e7f6ec;stroke:#8fce9f}
      .model{fill:#e8f0fe;stroke:#9cc0f5}
    </style>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="800" fill="#1b1f24">Household Chief of Staff — architecture</text>
  <text x="30" y="52" class="sub">Strands Agents SDK · Amazon Bedrock (Nova Pro) · AgentCore · serverless AWS</text>

  <!-- Trigger -->
  <rect class="box aws" x="30" y="80" width="170" height="58" rx="10"/>
  <text x="115" y="104" text-anchor="middle" class="lbl">EventBridge</text>
  <text x="115" y="120" text-anchor="middle" class="sub">Scheduler — daily</text>

  <!-- Sweep group -->
  <rect class="grp" x="30" y="170" width="500" height="330" rx="12"/>
  <text x="46" y="192" class="grptitle">DAILY SWEEP  ·  AWS Lambda  or  Bedrock AgentCore Runtime</text>

  <rect class="box det" x="60" y="210" width="180" height="52" rx="10"/>
  <text x="150" y="232" text-anchor="middle" class="lbl">triggers.py</text>
  <text x="150" y="248" text-anchor="middle" class="sub">does it qualify? (plain Python)</text>

  <rect class="box model" x="60" y="290" width="180" height="52" rx="10"/>
  <text x="150" y="312" text-anchor="middle" class="lbl">Strands agent</text>
  <text x="150" y="328" text-anchor="middle" class="sub">Bedrock · Nova Pro</text>

  <rect class="box det" x="60" y="370" width="180" height="52" rx="10"/>
  <text x="150" y="392" text-anchor="middle" class="lbl">guardrail.py</text>
  <text x="150" y="408" text-anchor="middle" class="sub">within budget? (plain Python)</text>

  <rect class="box" x="330" y="330" width="170" height="52" rx="10"/>
  <text x="415" y="352" text-anchor="middle" class="lbl">write Transaction</text>
  <text x="415" y="368" text-anchor="middle" class="sub">proposed + token</text>

  <rect class="box aws" x="330" y="420" width="170" height="52" rx="10"/>
  <text x="415" y="442" text-anchor="middle" class="lbl">Amazon SES</text>
  <text x="415" y="458" text-anchor="middle" class="sub">Approve / Reject email</text>

  <!-- vertical flow in sweep -->
  <path class="edge" d="M150 262 L150 288"/>
  <path class="edge" d="M150 342 L150 368"/>
  <path class="edge" d="M240 396 L328 360"/>
  <path class="edge" d="M415 382 L415 418"/>
  <text x="250" y="392" class="edgelbl">proposal</text>

  <path class="edge" d="M115 138 L115 208"/>
  <text x="122" y="176" class="edgelbl">{"action":"sweep"}</text>

  <!-- DynamoDB -->
  <rect class="box aws" x="330" y="210" width="170" height="58" rx="10"/>
  <text x="415" y="234" text-anchor="middle" class="lbl">Amazon DynamoDB</text>
  <text x="415" y="250" text-anchor="middle" class="sub">single table</text>
  <path class="edge" d="M415 330 L415 270"/>
  <path class="edge" d="M240 230 L328 233"/>
  <text x="250" y="222" class="edgelbl">read family data</text>

  <!-- Human decision -->
  <rect class="box" x="600" y="80" width="180" height="58" rx="10"/>
  <text x="690" y="104" text-anchor="middle" class="lbl">Family inbox</text>
  <text x="690" y="120" text-anchor="middle" class="sub">clicks a link</text>
  <path class="edge" d="M500 440 C 620 440 690 300 690 140"/>
  <text x="560" y="360" class="edgelbl">email</text>

  <rect class="box aws" x="600" y="180" width="180" height="58" rx="10"/>
  <text x="690" y="204" text-anchor="middle" class="lbl">API Gateway</text>
  <text x="690" y="220" text-anchor="middle" class="sub">HTTP API</text>
  <path class="edge" d="M690 138 L690 178"/>

  <rect class="box" x="600" y="280" width="180" height="66" rx="10"/>
  <text x="690" y="304" text-anchor="middle" class="lbl">API Lambda (FastAPI)</text>
  <text x="690" y="320" text-anchor="middle" class="sub">/approve /reject /admin</text>
  <text x="690" y="334" text-anchor="middle" class="sub">validate token · move budget</text>
  <path class="edge" d="M690 238 L690 278"/>
  <path class="edge" d="M600 320 L500 245"/>
  <text x="505" y="290" class="edgelbl">update</text>

  <!-- AgentCore group -->
  <rect class="grp" x="600" y="400" width="330" height="210" rx="12"/>
  <text x="616" y="422" class="grptitle">INTERACTIVE  ·  BEDROCK AGENTCORE RUNTIME</text>

  <rect class="box model" x="620" y="440" width="200" height="60" rx="10"/>
  <text x="720" y="463" text-anchor="middle" class="lbl">orchestrator.py</text>
  <text x="720" y="479" text-anchor="middle" class="sub">Strands agents-as-tools</text>

  <rect class="box aws" x="620" y="524" width="200" height="52" rx="10"/>
  <text x="720" y="546" text-anchor="middle" class="lbl">AgentCore Memory</text>
  <text x="720" y="562" text-anchor="middle" class="sub">context across sweeps</text>
  <path class="edge" d="M720 500 L720 522"/>
  <path class="edge" d="M840 470 C 900 470 900 300 782 250"/>
  <text x="852" y="360" class="edgelbl">Bedrock</text>
  <path class="edge" d="M620 455 C 520 455 470 300 502 250"/>
  <text x="470" y="430" class="edgelbl">read</text>
  <text x="500" y="470" class="edgelbl" transform="rotate(-4 500 470)">{"action":"ask"}</text>

  <!-- Secrets -->
  <rect class="box aws" x="330" y="500" width="200" height="46" rx="10"/>
  <text x="430" y="521" text-anchor="middle" class="lbl">AWS Secrets Manager</text>
  <text x="430" y="536" text-anchor="middle" class="sub">admin pw · sweep secret · SerpAPI</text>

  <text x="30" y="640" class="sub">Deterministic (plain Python): green.  Model call: blue.  Managed AWS service: cream.</text>
</svg>
